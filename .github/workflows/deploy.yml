# Every push to main deploys the site to Cloudflare Pages (the code only: his photos and galleries
# live in R2 and a deploy never touches them). Needs one repository secret, under Settings, Secrets
# and variables, Actions: CLOUDFLARE_API_TOKEN (Workers R2 Storage: Edit and Cloudflare Pages: Edit).
# The account id is not a secret (it is in the bucket's own address), so it is written here.
name: Deploy

env:
  CLOUDFLARE_ACCOUNT_ID: 7165fc1d6994c9688df5c8a66358da96

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Cloudflare token is set
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "The token is set."; echo "ok=yes" >> "$GITHUB_OUTPUT"
          else echo "::warning::Not deployed. Missing repository secret CLOUDFLARE_API_TOKEN (Settings, Secrets and variables, Actions, Repository secrets)."; echo "ok=no" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'yes'
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ok == 'yes'
        run: npm ci
      - name: Deploy to Cloudflare Pages
        if: steps.secrets.outputs.ok == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler pages deploy --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --format=%s)"
      - name: Check the live site
        if: steps.secrets.outputs.ok == 'yes'
        run: |
          site=https://jensen-design.pages.dev
          sleep 20  # the new deployment takes a moment to reach the address
          fail=0
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$site$1"); echo "$code $1"; [ "$code" = "$2" ] || fail=1; }
          for p in / /projects /about /contact /privacy /sitemap.xml /robots.txt; do check "$p" 200; done
          project=$(curl -s "$site/sitemap.xml" | grep -o "/projects/[^<]*" | head -1)
          check "$project" 200
          photo=$(curl -s "$site$project" | grep -o '/media/photos/[^"]*-w.jpg' | head -1)
          check "$photo" 200
          check /admin 401                   # locked until Cloudflare Access signs him in
          check /api/admin/galleries 401
          check /media/data/galleries.json 404   # his data is never public
          exit $fail
