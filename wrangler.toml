# Cloudflare Pages project for jensendesigncabinets.com (and telluridecabinets.com).
name = "jensen-design"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

# His photos, galleries, settings and messages: the live bucket (also used by `npm run dev`, which
# keeps its own local copy). Its layout is in functions/_lib/storage.js. Deploying never touches it.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "jensen-design-media"

[vars]
# Cloudflare Access, which guards /admin and /api/admin: the team name (from
# <team>.cloudflareaccess.com) and the application's Audience (AUD) tag.
ACCESS_TEAM = ""
ACCESS_AUD = ""

# Preview deploys (`npm run deploy:preview`, at preview.jensen-design.pages.dev) use a bucket of
# their own, so trying a change never touches his photos. Pages does not inherit these, so the
# settings above are repeated.
[env.preview]
[[env.preview.r2_buckets]]
binding = "MEDIA"
bucket_name = "jensen-design-media-preview"
[env.preview.vars]
ACCESS_TEAM = ""
ACCESS_AUD = ""

# Contact-form messages to his phone: see functions/_lib/notify.js (NTFY_URL, or the TWILIO_* settings),
# set as secrets with `npx wrangler pages secret put NAME`, never written here.

# Contact-form email to him (README step 5): uncomment once the domain is on Cloudflare with Email
# Routing on and jdesign@rmi.net verified as a destination. Until then messages are kept in /admin.
# [[send_email]]
# name = "MAILER"
# destination_address = "jdesign@rmi.net"
# MAIL_FROM = "website@jensendesigncabinets.com"   (goes under [vars])
